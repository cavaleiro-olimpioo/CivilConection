spring.application.name=civilconection
server.port=${SERVER_PORT:8080}

# Environment variables for Supabase PostgreSQL with H2 in-memory fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:civilconectiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Character encoding (prevents mojibake/� in served HTML)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8
